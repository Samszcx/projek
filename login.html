<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5fbf">
  <title>Masuk - INFORYZE26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("kaskita-theme") === "dark" ? "dark" : "light";
    } catch (e) {}
  </script>
</head>
<body class="login-body">
  <div class="login-orb login-orb-tr" aria-hidden="true"></div>
  <div class="login-orb login-orb-bl" aria-hidden="true"></div>

  <main class="login-card">
    <div class="login-card-content">
      <div class="login-brand-hero">
        <img src="inforyze.jpg" alt="Logo INFORYZE">
        <div class="login-hero-name">INFORYZE</div>
        <div class="login-hero-caption">Catatan Kas Angkatan</div>
      </div>

      <form id="login-form">
        <div class="login-inner-panel">
          <h1 class="login-title">Masuk ke INFORYZE</h1>

          <div class="field-group">
            <label class="field-label" for="login-name">Nama</label>
            <input class="input-text login-input" id="login-name" type="text" autocomplete="name" placeholder="Masukkan nama Anda">
          </div>

          <div class="field-group">
            <label class="field-label" for="role">Masuk Sebagai</label>
            <select class="input-text login-input" id="role" required>
              <option value="mahasiswa">Mahasiswa</option>
              <option value="pengelola">Pengelola / Pengurus</option>
            </select>
          </div>

          <div class="field-group" id="password-field" hidden>
            <label class="field-label" for="password">Password</label>
            <input class="input-text login-input" id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi pengelola">
          </div>

          <p class="login-error" id="error-message" role="alert" aria-live="polite"></p>
        </div>

        <button class="button login-submit-btn" id="submit-btn" type="submit">
          Masuk Ke Dashboard
        </button>
        <p class="login-access-note">Akses khusus anggota INFORYZE'26</p>
      </form>
    </div>

    <footer class="login-card-footer">
      &copy; 2026 INFORYZE'26 &middot; All Rights Reserved
    </footer>
  </main>

  <script src="static/js/login.js"></script>
</body>
</html>
