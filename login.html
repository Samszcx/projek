<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5fbf">
  <title>Masuk - INFORYZE26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("kaskita-theme") === "dark" ? "dark" : "light";
    } catch (e) {}
  </script>
</head>
<body class="login-body">
  <div style="position: absolute; top: 20px; right: 20px;">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ganti mode tema">☾</button>
  </div>

  <main class="login-card">
    <div class="login-brand">
      <img src="inforyze.jpg" alt="Logo INFORYZE">
      <div>
        <div class="brand-name" style="color: var(--text-main);">INFORYZE26</div>
        <div class="brand-caption" style="color: var(--text-muted);">Sistem Kas & Iuran Angkatan</div>
      </div>
    </div>

    <h1 class="login-title">Masuk ke INFORYZE26</h1>

    <form id="login-form">
      <div class="field-group">
        <label class="field-label" for="role">Masuk sebagai</label>
        <select class="input-text" id="role" required>
          <option value="mahasiswa">Mahasiswa</option>
          <option value="pengelola">Pengelola / Pengurus</option>
        </select>
      </div>

      <div class="field-group" id="password-field" hidden>
        <label class="field-label" for="password">Password Pengelola</label>
        <input class="input-text" id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi pengelola">
      </div>

      <p class="login-error" id="error-message" role="alert" aria-live="polite"></p>

      <button class="button button-primary" id="submit-btn" type="submit" style="width: 100%; padding: 12px;">
        Masuk
      </button>
    </form>
  </main>

  <script src="static/js/login.js"></script>
</body>
</html>
